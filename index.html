<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Jost:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="mainbox mainbox1">
      <img src="/images/drizzle.png" />
      <h1 class="weather">Weather</h1>
      <h2 class="forecast">Forecasts</h2>
      <button class="start">Get Start</button>
    </div>
    <div class="mainbox mainbox2 inactive">
      <div class="searchbox">
        <input type="text" placeholder="Enter your city" id="inputfield" />
        <div class="img"><img src="/images/search.png" id="searchicon" /></div>
      </div>
      <div class="iconbox">
        <img src="/images/clear.png" id="icon" />
        <p id="desc">Description</p>
      </div>
      <div class="tempbox">
        <h1 id="temp">0°</h1>
        <h3 id="city">New York</h3>
      </div>
      <div class="extradetails">
        <div class="wind">
          <img src="/images/wind.png" id="windicon" />
          <div class="winddata">
            <p id="windspeed">0km/h</p>
            <p>wind</p>
          </div>
        </div>
        <div class="humidity">
          <img src="/images/humidity.png" id="windicon" />
          <div class="humiditydata">
            <p id="humidityper">0%</p>
            <p>Humidity</p>
          </div>
        </div>
      </div>
    </div>

    <div class="mainbox mainbox3 inactive">
      <h1>404</h1>
      <p>Oops! Page Not Found</p>
      <p id="info">
        The page you're looking for doesn't exists or has been moved.
      </p>
      <button class="homebtn">Go Home</button>
    </div>
    
    <script src="app.js"></script>
  </body>
</html>
